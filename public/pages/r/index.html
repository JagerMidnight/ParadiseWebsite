<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaving Devil's Paradise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a202c;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg text-center max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-6">You are leaving Devil's Paradise!</h1>
        <p class="text-lg mb-8">
            Click 'Yes' to proceed to <span id="destinationLink" class="font-semibold text-blue-400">the external website</span>.
        </p>
        <button
            id="confirmButton"
            class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg text-xl transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-75">Yes.</button>
    </div>

    <script type="module">
        import allowedDomains from './domains.js';

        let redirectUrl = '';
        let isAllowed = false;

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const urlParam = params.get('url');

            const destinationLinkSpan = document.getElementById('destinationLink');
            const confirmButton = document.getElementById('confirmButton');

            if (urlParam) {
                try {
                    redirectUrl = decodeURIComponent(urlParam);
                    const url = new URL(redirectUrl);
                    
                    if (allowedDomains.includes(url.hostname)) {
                        destinationLinkSpan.textContent = url.hostname;
                        isAllowed = true;
                    } else {
                        destinationLinkSpan.textContent = 'an unauthorized external website';
                        console.warn(`Attempted redirect to unallowed domain: ${url.hostname}`);
                        if (confirmButton) {
                            confirmButton.disabled = true;
                            confirmButton.textContent = 'Not Allowed';
                        }
                    }

                } catch (e) {
                    destinationLinkSpan.textContent = 'an invalid external website';
                    console.error("Invalid URL parameter:", e);
                    if (confirmButton) {
                        confirmButton.disabled = true;
                        confirmButton.textContent = 'Invalid URL';
                    }
                }
            } else {
                destinationLinkSpan.textContent = 'an unknown external website';
                if (confirmButton) {
                    confirmButton.disabled = true;
                    confirmButton.textContent = 'No URL Provided';
                }
            }

            if (confirmButton) {
                confirmButton.addEventListener('click', () => {
                    if (redirectUrl && isAllowed) {
                        window.location.href = redirectUrl;
                    } else if (redirectUrl && !isAllowed) {
                        alert('Redirection to this website is not allowed.');
                    } else {
                        alert('No valid redirection URL provided.');
                    }
                });
            }
        });
    </script>
</body>
</html>
