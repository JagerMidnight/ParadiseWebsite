<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devils Paradise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('assets/guild hall.webp');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 150px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px;
        }
        .bottom-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 15px;
        }
        .bottom-links a {
            color: white;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            transition: color 0.3s ease;
        }
        .bottom-links a:hover {
            color: #d1d5db;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">
    <main>
        <ul class="bottom-links">
            <li><a href="/war-engine" class="hover:text-gray-300">War Engine</a></li>
            <li><a href="/r?url=https://discord.gg/5UPSebzn7W" class="hover:text-gray-300">Discord</a></li>
        </ul>
    </main>
</body>
</html>
